<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg">
    <video class="bg__video" id="bgVideo" autoplay muted loop playsinline preload="auto">
      <source src="assets/bgvideo.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg__overlay"></div>
  <div class="bg__stripes"></div>

  <main class="shell">
    <img class="logo" id="logo" src="assets/logo.png" alt="Server logo">
    <div class="status">
      <div class="status__title" id="statusTitle">Connecting</div>
      <div class="progress">
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
        </div>
        <div class="progress__meta">
          <span id="progressPercent">0%</span>
          <span id="progressLabel">Starting</span>
        </div>
      </div>
    </div>
    <div class="description" id="description">
      Preparing your connection and loading the server environment. Please wait while we set everything up for your session.
    </div>
    <div class="hint" id="audioHint">Space: toggle music</div>
  </main>

  <audio id="music" src="assets/music.mp3" preload="auto" loop></audio>
  <script src="js/main.js"></script>
</body>
</html>
